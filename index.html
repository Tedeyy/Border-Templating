<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBSC SAS Border Templating System</title>
  <link rel="icon" type="image/png" href="assets/img/NBSC_logo.png">
  <link rel="apple-touch-icon" href="assets/img/NBSC_logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-label="Template composer">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark">
            <img src="assets/img/NBSC_logo.png" alt="NBSC logo">
          </span>
          <div>
            <p class="eyebrow">Campaign Photo Composer</p>
            <h1>NBSC SAS Border Templating System</h1>
          </div>
        </div>
        <button class="primary-action" id="downloadBtn" type="button" disabled>Download PNG</button>
      </header>

      <div class="composer">
        <aside class="controls" aria-label="Editor controls">
          <div class="panel-heading">
            <h2>Editor</h2>
            <span>1080 x 1080</span>
          </div>

          <label class="upload-card">
            <span class="upload-title">Upload photo</span>
            <span class="upload-status" id="photoStatus">No photo selected</span>
            <input id="photoInput" type="file" accept="image/*">
            <button class="remove-photo-button" id="removePhotoBtn" type="button" hidden>Remove uploaded image</button>
          </label>

          <div class="field-group">
            <label for="templateSelect">Border</label>
            <select id="templateSelect">
              <option value="">Add PNG files to assets/img/imgtemplate</option>
            </select>
          </div>

          <div class="adjustments" id="photoSettings" aria-label="Photo adjustments" hidden>
            <div class="settings-heading">
              <div>
                <h3>Photo settings</h3>
                <p>Fine tune how your photo sits behind the border.</p>
              </div>
            </div>

            <div class="adjustment-control">
              <div class="control-head">
                <label for="zoomRange">Photo size</label>
                <output id="zoomValue" for="zoomRange">100%</output>
              </div>
              <div class="slider-row">
                <input id="zoomRange" type="range" min="0.5" max="3" step="0.01" value="1">
                <button class="mini-button" id="resetZoomBtn" type="button">Reset</button>
              </div>
            </div>

            <div class="adjustment-control">
              <div class="control-head">
                <label for="xOffsetRange">Move left / right</label>
                <output id="xOffsetValue" for="xOffsetRange">0 px</output>
              </div>
              <div class="slider-row">
                <input id="xOffsetRange" type="range" min="-540" max="540" step="1" value="0">
                <input id="xOffset" type="number" value="0" step="1" aria-label="Horizontal position in pixels">
              </div>
            </div>

            <div class="adjustment-control">
              <div class="control-head">
                <label for="yOffsetRange">Move up / down</label>
                <output id="yOffsetValue" for="yOffsetRange">0 px</output>
              </div>
              <div class="slider-row">
                <input id="yOffsetRange" type="range" min="-540" max="540" step="1" value="0">
                <input id="yOffset" type="number" value="0" step="1" aria-label="Vertical position in pixels">
              </div>
            </div>

            <div class="button-row two-col">
              <button id="resetPositionBtn" type="button">Reset Position</button>
              <button id="centerBtn" type="button">Center Photo</button>
            </div>
          </div>

          <div class="button-row fit-actions">
            <button id="fitBtn" type="button">Fit Entire Photo</button>
            <button id="fillBtn" type="button">Fill Border</button>
          </div>
        </aside>

        <section class="preview-panel" aria-label="Preview">
          <button class="primary-action mobile-download-action" id="mobileDownloadBtn" type="button" disabled>Download PNG</button>
          <div class="preview-header">
            <h2>Preview</h2>
          </div>
          <div class="template-details" aria-live="polite">
            <span class="template-details-label">Selected border details</span>
            <h3 id="templateTitle">No template selected</h3>
            <p id="templateDescription">Choose a border to view its details.</p>
          </div>
          <div class="canvas-stage">
            <canvas id="previewCanvas" width="1080" height="1080"></canvas>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>NBSC SAS Border Templating System</span>
    <a href="https://www.facebook.com/nbscstudentaffairsandservices" target="_blank" rel="noopener noreferrer">Facebook</a>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
